[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: fast, isolated tests with no real API calls or network access
    integration: tests that exercise multiple components together (e.g. via TestClient)
    live_api: tests that make a real call to the Groq API (excluded by default)

addopts = -m "not live_api"
