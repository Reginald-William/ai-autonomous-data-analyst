name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests (no live API calls, coverage gate at 70%)
        # GROQ_API_KEY is intentionally NOT set here — the whole point of
        # Phases 1-3's lazy-client/DI work was making the default suite run
        # without a real key. live_api-marked tests are excluded by
        # pytest.ini's addopts, so this never attempts a real Groq call.
        run: pytest -m "not live_api" --cov=src --cov-report=term-missing --cov-fail-under=70
